name: Deploy Demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Core unit tests
        run: pnpm --filter @tthappy/ppt-core test

      - name: Build packages (core + vue2 + vue3)
        run: pnpm build:core && pnpm build:vue2 && pnpm build:vue3

      - name: Build Vue 3 demo
        working-directory: playground/vue3-app
        run: pnpm exec vite build --base=/vue-ppt/

      - name: Build Vue 2 demo
        working-directory: playground/vue2-app
        env:
          PUBLIC_PATH: /vue-ppt/vue2/
        run: pnpm exec vue-cli-service build

      - name: Merge Vue 2 demo into Pages output
        run: |
          mkdir -p playground/vue3-app/dist/vue2
          cp -R playground/vue2-app/dist/. playground/vue3-app/dist/vue2/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/vue3-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
